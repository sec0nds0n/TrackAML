<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Crypto AML Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5" style="max-width: 400px;">
    <h2 class="text-center mb-4">TrackAML Hackathon 2.0</h2>
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='images/edo-2-hero.png') }}" 
           alt="Edo Mascot" 
           class="img-fluid" 
           style="max-width: 200px;">
    </div>

    <div id="alert-container"></div>

    <form method="POST">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <hr class="my-4">
    <div class="text-center">
      <p class="mb-2">Belum punya akun?</p>
      <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary w-100">Register</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertContainer = document.getElementById('alert-container');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert(data.message || 'Login gagal!', 'danger');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        showAlert('Login berhasil!', 'success');
        setTimeout(() => {
          window.location.href = '/wallet';
        }, 1000);
      } catch (err) {
        console.error(err);
        showAlert('Gagal menghubungi server.', 'danger');
      }
    });

    function showAlert(message, type = 'danger') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
