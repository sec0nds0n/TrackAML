{% extends "base.html" %}

{% block title %}Wallet{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2>Input Wallet Address</h2>
        </div>
        <div class="card-body">
            <form id="wallet-form">
                <div class="mb-3">
                    <label for="wallet_input" class="form-label">Enter Wallet Address:</label>
                    <input type="text" class="form-control" id="wallet_input" placeholder="Enter manually" required>
                </div>
                <button type="submit" class="btn btn-primary">Fetch Transactions</button>
            </form>
        </div>
    </div>

    <!-- Recent Wallet History -->
    <div class="card mt-4 d-none" id="history-card">
        <div class="card-header">
            <h3>Recent Wallet History</h3>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr><th>No.</th><th>Wallet Address</th><th>Queried At</th></tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Tombol API -->
    <div class="mt-4 d-flex gap-2">
        <button id="update-btn" class="btn btn-secondary w-100">Update Semua Wallet</button>
        <button id="sync-btn" class="btn btn-success w-100">🔄 Sinkronisasi Database</button>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    console.log('📢 Script wallet.html dimulai...');
    const token = localStorage.getItem('token');

    async function fetchHistory() {
        try {
            const res = await fetch('/api/wallets-api/history');
            const data = await res.json();
            console.log('✅ API response:', data);

            if (!res.ok) throw new Error(data.message || 'Gagal mengambil wallet history');
            if (!Array.isArray(data)) throw new Error('Format data tidak sesuai');

            const tbody = document.getElementById('history-body');
            const container = document.getElementById('history-card');

            tbody.innerHTML = '';
            if (data.length === 0) {
            console.log('⚠️ Tidak ada wallet history');
            container.classList.add('d-none');
            return;
            }

            data.forEach((row, i) => {
            tbody.insertAdjacentHTML('beforeend', `
                <tr>
                <td>${i + 1}</td>
                <td>${row.address}</td>
                <td>${new Date(row.queried_at).toLocaleString()}</td>
                </tr>
            `);
            });

            container.classList.remove('d-none');
        } catch (err) {
            console.error('❌ Gagal fetch history:', err);
            alert(err.message);
        }
    }
  // Fetch history saat halaman pertama kali load
  fetchHistory();
</script>
{% endblock %}
